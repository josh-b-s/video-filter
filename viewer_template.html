<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Skeleton Viewer</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #14171F; color: #e6e0fa; font-family: system-ui, sans-serif; overflow: hidden; }
  #plot { width: 100vw; height: 82vh; }
  #controls { height: 18vh; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; box-sizing: border-box; gap: 10px; }
  #row { display: flex; align-items: center; gap: 16px; }
  button { background: #9b6fe0; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #ad86e8; }
  input[type=range] { flex: 1; }
  #frameLabel { min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
  select { background: #1f2330; border: 1px solid #3a3f52; color: #e6e0fa; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  #legend { display: flex; align-items: center; gap: 18px; font-size: 12px; color: #b8b2d4; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
  <div id="plot"></div>
  <div id="controls">
    <div id="row">
      <button id="playBtn">Play</button>
      <input type="range" id="slider" min="0" value="0" step="1" />
      <span id="frameLabel">0 / 0</span>
      <label for="speed" style="font-size:12px;color:#b8b2d4;">Speed</label>
      <select id="speed">
        <option value="4">0.25x</option>
        <option value="2">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="0.5">2x</option>
        <option value="0.25">4x</option>
      </select>
    </div>
    <div id="row">
      <div id="legend">
        <span><span class="swatch" style="background:#ff6a5c"></span>Right side</span>
        <span><span class="swatch" style="background:#5cc8ff"></span>Left side</span>
        <span><span class="swatch" style="background:#c9c0e8"></span>Center / torso</span>
      </div>
    </div>
  </div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const DATA = __SKELETON_DATA__;
const frames = DATA.frames;
const numFrames = frames.length;

const RIGHT_COLOR = 0xff6a5c;
const LEFT_COLOR = 0x5cc8ff;
const CENTER_COLOR = 0xc9c0e8;
const bgColor = 0x14171f;

// ---------- Three.js scene ----------
const container = document.getElementById("plot");
const scene = new THREE.Scene();
scene.background = new THREE.Color(bgColor);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.05, 50);
camera.position.set(1.8, 1.3, 2.4);

const renderer3d = new THREE.WebGLRenderer({ antialias: true });
renderer3d.setSize(container.clientWidth, container.clientHeight);
renderer3d.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer3d.domElement);

const controls = new OrbitControls(camera, renderer3d.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x33334d, 1.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
dirLight.position.set(2, 4, 2);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(-2, 1, -2);
scene.add(fillLight);

const grid = new THREE.GridHelper(4, 16, 0x3a3f52, 0x24283a);
scene.add(grid);

window.addEventListener("resize", () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer3d.setSize(container.clientWidth, container.clientHeight);
});

function animateLoop() {
  requestAnimationFrame(animateLoop);
  controls.update();
  renderer3d.render(scene, camera);
}
animateLoop();

// ---------- Materials ----------
const matLeft = new THREE.MeshStandardMaterial({ color: LEFT_COLOR, roughness: 0.5, metalness: 0.05 });
const matRight = new THREE.MeshStandardMaterial({ color: RIGHT_COLOR, roughness: 0.5, metalness: 0.05 });
const matCenter = new THREE.MeshStandardMaterial({ color: CENTER_COLOR, roughness: 0.5, metalness: 0.05 });
function matForSide(side) {
  return side === "left" ? matLeft : side === "right" ? matRight : matCenter;
}

// ---------- Curated body segments (MediaPipe pose landmark indices) ----------
// Only the indices that matter for a clean anatomical figure are used --
// fingers/toes/face are intentionally ignored so it reads like a solid
// bathroom-sign figure rather than a cloud of raw landmark dots.
const LIMB_SEGMENTS = [
  { name: "lUpperArm", a: 11, b: 13, side: "left", radius: 0.055 },
  { name: "lForearm", a: 13, b: 15, side: "left", radius: 0.048 },
  { name: "rUpperArm", a: 12, b: 14, side: "right", radius: 0.055 },
  { name: "rForearm", a: 14, b: 16, side: "right", radius: 0.048 },
  { name: "lThigh", a: 23, b: 25, side: "left", radius: 0.075 },
  { name: "lShin", a: 25, b: 27, side: "left", radius: 0.06 },
  { name: "rThigh", a: 24, b: 26, side: "right", radius: 0.075 },
  { name: "rShin", a: 26, b: 28, side: "right", radius: 0.06 },
  { name: "lFoot", a: 27, b: 31, side: "left", radius: 0.04 },
  { name: "rFoot", a: 28, b: 32, side: "right", radius: 0.04 },
  { name: "lHand", a: 15, b: 19, side: "left", radius: 0.035 },
  { name: "rHand", a: 16, b: 20, side: "right", radius: 0.035 },
];

const JOINT_SPHERES = [
  { idx: 11, side: "left", radius: 0.065 },
  { idx: 12, side: "right", radius: 0.065 },
  { idx: 13, side: "left", radius: 0.055 },
  { idx: 14, side: "right", radius: 0.055 },
  { idx: 15, side: "left", radius: 0.05 },
  { idx: 16, side: "right", radius: 0.05 },
  { idx: 23, side: "left", radius: 0.08 },
  { idx: 24, side: "right", radius: 0.08 },
  { idx: 25, side: "left", radius: 0.065 },
  { idx: 26, side: "right", radius: 0.065 },
  { idx: 27, side: "left", radius: 0.055 },
  { idx: 28, side: "right", radius: 0.055 },
];

// ---------- Build pooled meshes once; only transforms change per frame ----------
const cylinderGeom = new THREE.CylinderGeometry(1, 1, 1, 14, 1);
const sphereGeom = new THREE.SphereGeometry(1, 18, 14);
const torsoGeom = new RoundedBoxGeometry(1, 1, 1, 4, 0.18);

const limbMeshes = {};
for (const seg of LIMB_SEGMENTS) {
  const mesh = new THREE.Mesh(cylinderGeom, matForSide(seg.side));
  mesh.visible = false;
  scene.add(mesh);
  limbMeshes[seg.name] = mesh;
}

const jointMeshes = {};
for (const j of JOINT_SPHERES) {
  const mesh = new THREE.Mesh(sphereGeom, matForSide(j.side));
  mesh.visible = false;
  scene.add(mesh);
  jointMeshes[j.idx] = mesh;
}

const neckMesh = new THREE.Mesh(cylinderGeom, matCenter);
neckMesh.visible = false;
scene.add(neckMesh);

const headMesh = new THREE.Mesh(sphereGeom, matCenter);
headMesh.visible = false;
scene.add(headMesh);

const torsoMesh = new THREE.Mesh(torsoGeom, matCenter);
torsoMesh.visible = false;
scene.add(torsoMesh);

// ---------- Per-frame transform helpers ----------
const UP = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3();
const _mid = new THREE.Vector3();
const _quat = new THREE.Quaternion();

function pointOf(points, key) {
  const v = points[key];
  if (!v) return null;
  // Exporter writes (x, -z, -y): slot 1 is depth-toward-camera, slot 2
  // is vertical-up. Three.js treats the *second* component as vertical,
  // so slots 1 and 2 must be swapped here, or every mesh's "up" axis
  // ends up pointing along depth instead (this was the "torso facing
  // the sky" bug).
  return new THREE.Vector3(v[0] + CURRENT_OFFSET.x, v[2] + CURRENT_OFFSET.y, v[1] + CURRENT_OFFSET.z);
}

function swappedRaw(points, key) {
  const v = points[key];
  return v ? { x: v[0], y: v[2], z: v[1] } : null;
}

const FEET_INDICES = ["27", "28", "29", "30", "31", "32"]; // ankles, heels, foot-index

// Horizontal (X/Z) centering is computed once from frame 0 only, so the
// figure doesn't drift sideways frame to frame -- this part is fine to
// fix once. Vertical grounding, however, is recomputed every frame
// (see computeFloorOffset below): MediaPipe's world landmarks are
// hip-root-relative, not an absolute position in the room, so the
// estimated hip-to-ankle distance drifts slightly as knees bend. A
// single frame-0 floor offset makes squats/lunges appear to sink into
// or float above the grid; snapping the lowest foot point to the floor
// every frame keeps feet planted regardless of that per-frame drift.
function computeCenterXZ() {
  const raw = frames[0] || {};
  const lHip = swappedRaw(raw, "23");
  const rHip = swappedRaw(raw, "24");
  if (lHip && rHip) {
    return { x: -(lHip.x + rHip.x) / 2, z: -(lHip.z + rHip.z) / 2 };
  }
  return { x: 0, z: 0 };
}
const CENTER_XZ = computeCenterXZ();

function computeFloorOffsetY(points) {
  let floorY = Infinity;
  let any = false;
  for (const k of FEET_INDICES) {
    const p = swappedRaw(points, k);
    if (p) { floorY = Math.min(floorY, p.y); any = true; }
  }
  if (!any) {
    for (const k of Object.keys(points)) {
      const p = swappedRaw(points, k);
      if (p) floorY = Math.min(floorY, p.y);
    }
  }
  return Number.isFinite(floorY) ? -floorY : 0;
}

let CURRENT_OFFSET = { x: CENTER_XZ.x, y: 0, z: CENTER_XZ.z };

// Orients + scales a unit cylinder mesh to span from a to b.
function placeCylinder(mesh, a, b, radius) {
  if (!a || !b) { mesh.visible = false; return; }
  const length = a.distanceTo(b);
  if (length < 1e-5) { mesh.visible = false; return; }
  _mid.addVectors(a, b).multiplyScalar(0.5);
  _dir.subVectors(b, a).normalize();
  _quat.setFromUnitVectors(UP, _dir);
  mesh.position.copy(_mid);
  mesh.quaternion.copy(_quat);
  mesh.scale.set(radius, length, radius);
  mesh.visible = true;
}

function placeSphere(mesh, p, radius) {
  if (!p) { mesh.visible = false; return; }
  mesh.position.copy(p);
  mesh.scale.setScalar(radius);
  mesh.visible = true;
}

// Torso is oriented with its own basis (not just an up-vector) so it
// twists correctly with the shoulder line instead of just pointing
// shoulder-mid to hip-mid with an arbitrary roll.
const _yAxis = new THREE.Vector3();
const _xAxis = new THREE.Vector3();
const _zAxis = new THREE.Vector3();
const _basis = new THREE.Matrix4();

function placeTorso(mesh, shoulderMid, hipMid, shoulderVec, shoulderWidth) {
  if (!shoulderMid || !hipMid) { mesh.visible = false; return; }
  const height = shoulderMid.distanceTo(hipMid);
  if (height < 1e-5) { mesh.visible = false; return; }
  _yAxis.subVectors(shoulderMid, hipMid).normalize();
  _xAxis.copy(shoulderVec).normalize();
  const proj = _xAxis.dot(_yAxis);
  _xAxis.addScaledVector(_yAxis, -proj).normalize(); // re-orthogonalize so the box doesn't shear
  _zAxis.crossVectors(_xAxis, _yAxis).normalize();
  _basis.makeBasis(_xAxis, _yAxis, _zAxis);
  _quat.setFromRotationMatrix(_basis);
  _mid.addVectors(shoulderMid, hipMid).multiplyScalar(0.5);
  mesh.position.copy(_mid);
  mesh.quaternion.copy(_quat);
  const width = Math.max(shoulderWidth, 0.18);
  mesh.scale.set(width, height, width * 0.55);
  mesh.visible = true;
}

function showFrame(i) {
  const points = frames[i] || {};
  frameLabel.textContent = `${i} / ${Math.max(0, numFrames - 1)}`;

  CURRENT_OFFSET = { x: CENTER_XZ.x, y: computeFloorOffsetY(points), z: CENTER_XZ.z };

  for (const seg of LIMB_SEGMENTS) {
    const a = pointOf(points, String(seg.a));
    const b = pointOf(points, String(seg.b));
    placeCylinder(limbMeshes[seg.name], a, b, seg.radius);
  }

  for (const j of JOINT_SPHERES) {
    placeSphere(jointMeshes[j.idx], pointOf(points, String(j.idx)), j.radius);
  }

  const lShoulder = pointOf(points, "11");
  const rShoulder = pointOf(points, "12");
  const lHip = pointOf(points, "23");
  const rHip = pointOf(points, "24");

  let shoulderMid = null, hipMid = null, shoulderVec = null, shoulderWidth = 0.3;
  if (lShoulder && rShoulder) {
    shoulderMid = lShoulder.clone().add(rShoulder).multiplyScalar(0.5);
    shoulderVec = rShoulder.clone().sub(lShoulder);
    shoulderWidth = shoulderVec.length();
  }
  if (lHip && rHip) {
    hipMid = lHip.clone().add(rHip).multiplyScalar(0.5);
  }
  if (shoulderMid && hipMid && shoulderVec) {
    placeTorso(torsoMesh, shoulderMid, hipMid, shoulderVec, shoulderWidth);
  } else {
    torsoMesh.visible = false;
  }

  // Head position: prefer the synthetic "head" point (present when the
  // exporter's SHOW_ALL_LANDMARKS is False), else fall back to the nose
  // landmark (index 0), which is present when it's True.
  const headPos = pointOf(points, "head") || pointOf(points, "0");
  const neckBase = pointOf(points, "neck") || shoulderMid;

  if (headPos) {
    placeSphere(headMesh, headPos, Math.max(shoulderWidth * 0.32, 0.11));
  } else {
    headMesh.visible = false;
  }
  if (headPos && neckBase) {
    placeCylinder(neckMesh, neckBase, headPos, 0.05);
  } else {
    neckMesh.visible = false;
  }
}

// ---------- Controls ----------
const slider = document.getElementById("slider");
const frameLabel = document.getElementById("frameLabel");
const playBtn = document.getElementById("playBtn");
const speedSelect = document.getElementById("speed");
slider.max = Math.max(0, numFrames - 1);

showFrame(0);
slider.addEventListener("input", () => showFrame(parseInt(slider.value, 10)));

let playing = false;
let playTimer = null;

function startPlayTimer() {
  clearInterval(playTimer);
  const intervalMs = 33 * parseFloat(speedSelect.value);
  playTimer = setInterval(() => {
    let next = parseInt(slider.value, 10) + 1;
    if (next > numFrames - 1) next = 0;
    slider.value = next;
    showFrame(next);
  }, intervalMs);
}

playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) {
    startPlayTimer();
  } else {
    clearInterval(playTimer);
  }
});

speedSelect.addEventListener("change", () => {
  if (playing) startPlayTimer();
});
</script>
</body>
</html>
